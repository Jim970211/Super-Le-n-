<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEÓN QUANTUM 007</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-badge">F</span>
          <div>
            <p>Productividad</p>
            <h1>LEÓN QUANTUM 007
             <h1>
            </h1>
          </div>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
          🌙
        </button>
      </header>

      <main class="app-card">
        <section class="stats" aria-label="Estadísticas">
          <div class="stat-box">
            <span>Total</span>
            <strong id="total-count">0</strong>
          </div>
          <div class="stat-box">
            <span>Pendientes</span>
            <strong id="pending-count">0</strong>
          </div>
          <div class="stat-box">
            <span>Completadas</span>
            <strong id="completed-count">0</strong>
          </div>
        </section>

        <form id="task-form" class="task-form">
          <div class="input-wrap wide">
            <label for="task-input">Tarea</label>
            <input
              id="task-input"
              type="text"
              placeholder="¿Qué quieres hacer hoy?"
              aria-label="Nueva tarea"
              maxlength="140"
              required
            />
          </div>

          <div class="input-wrap">
            <label for="task-priority">Prioridad</label>
            <select id="task-priority">
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
            </select>
          </div>

          <div class="input-wrap">
            <label for="task-date">Fecha</label>
            <input id="task-date" type="date" />
          </div>

          <button class="primary-btn" type="submit">Agregar</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="Filtros de tareas">
            <button class="filter-btn active" data-filter="all" type="button">Todas</button>
            <button class="filter-btn" data-filter="active" type="button">Pendientes</button>
            <button class="filter-btn" data-filter="completed" type="button">Completadas</button>
          </div>
          <button id="clear-completed" class="secondary-btn" type="button">Limpiar hechas</button>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </main>
    </div>

    <template id="task-template">
      <li class="task-item" data-id="">
        <div class="task-main">
          <input type="checkbox" class="task-check" />
          <div class="task-copy">
            <span class="task-text"></span>
            <div class="task-meta">
              <span class="priority-pill"></span>
              <span class="task-date"></span>
            </div>
          </div>
        </div>

        <div class="task-actions">
          <button class="edit-btn" type="button">Editar</button>
          <button class="delete-btn" type="button">Eliminar</button>
        </div>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
